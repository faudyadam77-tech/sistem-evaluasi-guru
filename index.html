<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluasi Siswa</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f1f5f9;--card:#fff;
    --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
    --success:#16a34a;--danger:#dc2626;--warn:#f59e0b;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;background-size:cover;
    background-attachment:fixed;background-position:center}
  body.has-bg::before{content:'';position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:-1}
  #root{min-height:100vh}
  .hidden{display:none!important}

  /* Top bar */
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand img{height:36px;width:36px;object-fit:contain;border-radius:6px}
  .user-info{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
  .badge{background:#dbeafe;color:var(--primary-dark);padding:3px 8px;border-radius:20px;
    font-size:12px;font-weight:600}
  .badge.admin{background:#fee2e2;color:#991b1b}

  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,#1e3a8a,#2563eb)}
  .login-card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:400px;
    box-shadow:0 20px 40px rgba(0,0,0,.2)}
  .login-card h1{font-size:22px;margin-bottom:6px}
  .login-card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:#f1f5f9;padding:4px;border-radius:10px}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;cursor:pointer;
    border-radius:7px;font-weight:600;color:var(--muted);font-size:14px}
  .tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* Form */
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
  textarea{resize:vertical;min-height:80px}
  .field{margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* Buttons */
  .btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-ghost{background:#f1f5f9;color:var(--text)}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-block{width:100%;justify-content:center}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.6;cursor:not-allowed}

  /* Layout */
  .layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 61px)}
  .sidebar{background:#fff;border-right:1px solid var(--border);padding:16px 0}
  .sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;
    cursor:pointer;font-size:14px;color:#334155;border-left:3px solid transparent}
  .sidebar .nav-item:hover{background:#f8fafc}
  .sidebar .nav-item.active{background:#eff6ff;color:var(--primary);
    border-left-color:var(--primary);font-weight:600}
  .sidebar .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);padding:14px 20px 6px;font-weight:700}
  .content{padding:24px;overflow-x:auto}
  .content h2{font-size:20px;margin-bottom:4px}
  .content .subtitle{color:var(--muted);font-size:13px;margin-bottom:20px}

  /* Card */
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:16px}
  .card h3{font-size:15px;margin-bottom:14px;color:#334155}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:780px){
    .layout{grid-template-columns:1fr}
    .sidebar{display:flex;overflow-x:auto;padding:8px;border-right:none;
      border-bottom:1px solid var(--border)}
    .sidebar .nav-item{padding:8px 12px;border-left:none;border-bottom:2px solid transparent;
      white-space:nowrap}
    .sidebar .nav-item.active{border-left:none;border-bottom-color:var(--primary)}
    .sidebar .nav-title{display:none}
    .grid-2,.row{grid-template-columns:1fr}
  }

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;font-weight:600;color:#334155;font-size:12px;
    text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:#f8fafc}
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px}

  /* Score input */
  .aspect-row{display:grid;grid-template-columns:1fr 90px;align-items:center;
    gap:10px;padding:8px 0;border-bottom:1px dashed #e2e8f0}
  .aspect-row:last-child{border-bottom:none}
  .aspect-row span{font-size:14px}
  .score-badge{display:inline-block;background:#eff6ff;color:var(--primary-dark);
    padding:6px 12px;border-radius:8px;font-weight:700;font-size:18px}

  /* Alert */
  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:100%}
  .modal h3{margin-bottom:10px}
  .modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

  /* Print view */
  @media print{
    body{background:#fff!important}
    body.has-bg::before{display:none}
  }
  .print-only{display:none}
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';

/* ============================================================
 *  GANTI BARIS DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT ANDA
 *  (Deploy > New deployment > Web app > Execute as: Me,
 *   Who has access: Anyone > Copy URL)
 * ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbx0EhbgwVyTVO-ctpKFK-_mVPUJGWMOsYJqEw7bahiKNptHvIab5SAelc_eQpRifKil/exec';
/* ============================================================ */

/* ---------- State ---------- */
const state = {
  user: null,
  config: {},
  view: 'login',
  loginTab: 'login',
  students: [],
  evaluations: [],
  teachers: [],
  loading: false,
  msg: null
};

const saved = localStorage.getItem('evalUser');
if (saved) { try { state.user = JSON.parse(saved); state.view = state.user.role === 'admin' ? 'admin-config' : 'teacher-home'; } catch(e){} }

/* ---------- API ---------- */
async function api(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Terjadi kesalahan server');
  return json.data;
}

function showMsg(text, type = 'info') {
  state.msg = { text, type };
  render();
  setTimeout(() => { state.msg = null; render(); }, 3500);
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '-'; const x=new Date(d); if(isNaN(x)) return '-';
  return x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }

/* ---------- Auth ---------- */
async function doLogin(e) {
  e.preventDefault();
  const f = e.target;
  try {
    state.loading = true; render();
    const u = await api('login', { username: f.username.value, password: f.password.value });
    state.user = u;
    localStorage.setItem('evalUser', JSON.stringify(u));
    state.view = 'teacher-home';
    await loadConfig();
    await loadEvaluations();
    showMsg('Login berhasil. Selamat datang, ' + u.fullName, 'success');
  } catch(err){ showMsg(err.message, 'error'); }
  finally { state.loading = false; render(); }
}

async function doRegister(e) {
  e.preventDefault();
  const f = e.target;
  try {
    state.loading = true; render();
    await api('register', {
      username: f.username.value, password: f.password.value, fullName: f.fullName.value
    });
    showMsg('Akun berhasil dibuat. Silakan login.', 'success');
    state.loginTab = 'login';
  } catch(err){ showMsg(err.message, 'error'); }
  finally { state.loading = false; render(); }
}

function askAdmin() {
  const pwd = prompt('Masukkan password admin:');
  if (!pwd) return;
  api('adminLogin', { password: pwd }).then(u => {
    state.user = u;
    localStorage.setItem('evalUser', JSON.stringify(u));
    state.view = 'admin-config';
    loadConfig().then(render);
    showMsg('Mode admin aktif', 'success');
  }).catch(err => showMsg(err.message, 'error'));
}

function logout() {
  state.user = null; state.evaluations = []; state.students = [];
  localStorage.removeItem('evalUser');
  state.view = 'login';
  render();
}

/* ---------- Data loaders ---------- */
async function loadConfig() {
  try {
    state.config = await api('getConfig');
    if (state.config.bgUrl) {
      document.body.style.backgroundImage = `url('${state.config.bgUrl}')`;
      document.body.classList.add('has-bg');
    } else {
      document.body.style.backgroundImage = '';
      document.body.classList.remove('has-bg');
    }
  } catch(e){ console.error(e); }
}

async function loadStudents() {
  try { state.students = await api('getStudents'); } catch(e){}
}

async function loadEvaluations() {
  try {
    const payload = state.user.role === 'admin'
      ? { adminPassword: ADMIN_PWD() }
      : { teacherUsername: state.user.username };
    state.evaluations = await api('getEvaluations', payload);
  } catch(e){ showMsg(e.message,'error'); }
}

// simpan password admin sementara di memory (diminta di awal)
function ADMIN_PWD(){
  return sessionStorage.getItem('adminPwd') || '';
}

/* ============================================================
 *  VIEWS
 * ============================================================ */

function render() {
  const root = document.getElementById('root');
  if (!state.user) root.innerHTML = renderLogin();
  else root.innerHTML = renderApp();
  bindEvents();
}

/* ---------- Login ---------- */
function renderLogin() {
  const cfg = state.config;
  return `
  <div class="login-wrap" style="${cfg.bgUrl?`background:linear-gradient(135deg,rgba(30,58,138,.85),rgba(37,99,235,.85)),url('${esc(cfg.bgUrl)}') center/cover`:''}">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:18px">
        ${cfg.logoUrl?`<img src="${esc(cfg.logoUrl)}" style="height:56px;margin-bottom:8px">`:''}
        <h1>${esc(cfg.schoolName || 'Evaluasi Siswa')}</h1>
        <div class="sub">Aplikasi Evaluasi Perkembangan Siswa</div>
      </div>

      <div class="tabs">
        <button class="${state.loginTab==='login'?'active':''}" data-tab="login">Masuk</button>
        <button class="${state.loginTab==='register'?'active':''}" data-tab="register">Daftar</button>
      </div>

      ${state.msg ? `<div class="alert alert-${state.msg.type}">${esc(state.msg.text)}</div>` : ''}

      ${state.loginTab === 'login' ? `
        <form id="form-login">
          <div class="field"><label>Username</label>
            <input name="username" required autocomplete="username"></div>
          <div class="field"><label>Password</label>
            <input name="password" type="password" required autocomplete="current-password"></div>
          <button class="btn btn-primary btn-block" ${state.loading?'disabled':''}>
            ${state.loading?'Memproses...':'Masuk'}
          </button>
        </form>
      ` : `
        <form id="form-register">
          <div class="field"><label>Nama Lengkap</label>
            <input name="fullName" required></div>
          <div class="field"><label>Username</label>
            <input name="username" required autocomplete="username"></div>
          <div class="field"><label>Password</label>
            <input name="password" type="password" required minlength="4"></div>
          <button class="btn btn-primary btn-block" ${state.loading?'disabled':''}>
            ${state.loading?'Memproses...':'Daftar Akun Guru'}
          </button>
        </form>
      `}

      <div style="text-align:center;margin-top:16px">
        <button class="btn btn-ghost btn-sm" id="btn-admin">🔐 Masuk Mode Admin</button>
      </div>
    </div>
  </div>`;
}

/* ---------- App shell ---------- */
function renderApp() {
  const u = state.user;
  const isAdmin = u.role === 'admin';
  const cfg = state.config;

  const navTeacher = [
    { id:'teacher-home',  label:'📋 Evaluasi Saya' },
    { id:'teacher-new',   label:'➕ Buat Evaluasi' },
    { id:'teacher-report',label:'🖨️ Cetak & Kirim' }
  ];
  const navAdmin = [
    { id:'admin-config',   label:'⚙️ Konfigurasi' },
    { id:'admin-students', label:'👥 Data Siswa' },
    { id:'admin-teachers', label:'👨‍🏫 Akun Guru' },
    { id:'admin-evals',    label:'📊 Semua Evaluasi' },
    { id:'admin-report',   label:'🖨️ Rangkuman & Cetak' }
  ];
  const nav = isAdmin ? navAdmin : navTeacher;

  return `
  <div class="topbar">
    <div class="brand">
      ${cfg.logoUrl?`<img src="${esc(cfg.logoUrl)}">`:''}
      <span>${esc(cfg.schoolName || 'Evaluasi Siswa')}</span>
    </div>
    <div class="user-info">
      <span>${esc(u.fullName)}</span>
      <span class="badge ${isAdmin?'admin':''}">${isAdmin?'ADMIN':'GURU'}</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="nav-title">Menu</div>
      ${nav.map(n=>`<div class="nav-item ${state.view===n.id?'active':''}" data-nav="${n.id}">${n.label}</div>`).join('')}
    </aside>
    <main class="content">
      ${state.msg?`<div class="alert alert-${state.msg.type}">${esc(state.msg.text)}</div>`:''}
      ${renderView()}
    </main>
  </div>`;
}

function renderView() {
  switch(state.view){
    case 'teacher-home':   return viewTeacherHome();
    case 'teacher-new':    return viewTeacherNew();
    case 'teacher-report': return viewTeacherReport();
    case 'admin-config':   return viewAdminConfig();
    case 'admin-students': return viewAdminStudents();
    case 'admin-teachers': return viewAdminTeachers();
    case 'admin-evals':    return viewAdminEvals();
    case 'admin-report':   return viewAdminReport();
    default: return '<div class="card">Halaman tidak ditemukan</div>';
  }
}

/* ---------- Teacher: daftar evaluasi ---------- */
function viewTeacherHome() {
  const list = state.evaluations;
  if (!list.length) return `
    <h2>Evaluasi Saya</h2>
    <div class="subtitle">Daftar evaluasi yang pernah Anda buat.</div>
    <div class="card" style="text-align:center;padding:40px">
      <p style="color:var(--muted);margin-bottom:16px">Belum ada evaluasi.</p>
      <button class="btn btn-primary" data-nav="teacher-new">➕ Buat Evaluasi Pertama</button>
    </div>`;

  return `
    <h2>Evaluasi Saya</h2>
    <div class="subtitle">Total ${list.length} evaluasi.</div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Siswa</th><th>Kelas</th><th>Periode</th>
        <th>Akademik</th><th>Karakter</th><th>Tanggal</th><th>Aksi</th>
      </tr></thead>
      <tbody>
        ${list.map(e=>`
          <tr>
            <td><strong>${esc(e.studentName)}</strong></td>
            <td>${esc(e.studentClass)}</td>
            <td>${esc(e.period)}</td>
            <td><span class="score-badge" style="font-size:14px;padding:3px 8px">${esc(e.acadScore)}</span></td>
            <td><span class="score-badge" style="font-size:14px;padding:3px 8px">${esc(e.karScore)}</span></td>
            <td>${fmtDate(e.createdAt)}</td>
            <td>
              <button class="btn btn-ghost btn-sm" data-detail="${esc(e.id)}">Detail</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
}

/* ---------- Teacher: form evaluasi baru ---------- */
function viewTeacherNew() {
  const classes = (state.config.classes||'').split(',').map(s=>s.trim()).filter(Boolean);
  const periods = currentPeriods();
  return `
  <h2>Buat Evaluasi Baru</h2>
  <div class="subtitle">Isi penilaian perkembangan kognitif/akademik dan karakter/akhlaq siswa.</div>

  <form id="form-eval">
    <div class="card">
      <h3>Identitas Siswa</h3>
      <div class="row">
        <div class="field">
          <label>Kelas</label>
          <select name="studentClass" id="sel-class" required>
            <option value="">— Pilih Kelas —</option>
            ${classes.map(c=>`<option>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Nama Siswa</label>
          <input name="studentName" id="inp-student" list="student-list" required
                 placeholder="Ketik atau pilih nama siswa">
          <datalist id="student-list">
            ${state.students.map(s=>`<option data-kelas="${esc(s.className)}" value="${esc(s.name)}">${esc(s.className)}</option>`).join('')}
          </datalist>
        </div>
      </div>
      <div class="field">
        <label>Periode Penilaian</label>
        <select name="period" required>
          ${periods.map(p=>`<option>${esc(p)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>🧠 Perkembangan Kognitif / Akademik</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px">
          Skala 1 (kurang) – 5 (sangat baik).</p>
        ${aspectRow('acadPemahaman','Pemahaman Materi')}
        ${aspectRow('acadPartisipasi','Partisipasi Aktif')}
        ${aspectRow('acadTugas','Penyelesaian Tugas/PR')}
        ${aspectRow('acadAnalisis','Kemampuan Analisis')}
        <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
          <strong>Nilai Akademik:</strong>
          <span class="score-badge" id="acadScore">60</span>
          <span style="color:var(--muted);font-size:12px">/100</span>
        </div>
        <div class="field" style="margin-top:12px">
          <label>Catatan Akademik</label>
          <textarea name="acadNotes" placeholder="Catatan perkembangan akademik..."></textarea>
        </div>
      </div>

      <div class="card">
        <h3>🌟 Perkembangan Karakter / Akhlaq</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px">
          Skala 1 (kurang) – 5 (sangat baik).</p>
        ${aspectRow('karKejujuran','Kejujuran')}
        ${aspectRow('karDisiplin','Kedisiplinan')}
        ${aspectRow('karSopan','Sopan Santun')}
        ${aspectRow('karTanggungJawab','Tanggung Jawab')}
        ${aspectRow('karKerjasama','Kerjasama')}
        <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
          <strong>Nilai Karakter:</strong>
          <span class="score-badge" id="karScore">60</span>
          <span style="color:var(--muted);font-size:12px">/100</span>
        </div>
        <div class="field" style="margin-top:12px">
          <label>Catatan Karakter</label>
          <textarea name="karNotes" placeholder="Catatan perkembangan karakter/akhlaq..."></textarea>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn btn-ghost" data-nav="teacher-home">Batal</button>
      <button class="btn btn-primary" ${state.loading?'disabled':''}>
        ${state.loading?'Menyimpan...':'💾 Simpan Evaluasi'}
      </button>
    </div>
  </form>`;
}

function aspectRow(name, label) {
  return `<div class="aspect-row">
    <span>${label}</span>
    <select name="${name}" class="aspect-score" data-aspect>
      <option value="1">1 - Kurang</option>
      <option value="2">2 - Cukup</option>
      <option value="3" selected>3 - Baik</option>
      <option value="4">4 - Sangat Baik</option>
      <option value="5">5 - Istimewa</option>
    </select>
  </div>`;
}

function currentPeriods() {
  const y = new Date().getFullYear();
  return [
    `Semester 1 ${y}/${y+1}`,
    `Semester 2 ${y-1}/${y}`,
    `Semester 1 ${y-1}/${y}`,
    `Semester 2 ${y-2}/${y-1}`
  ];
}

/* ---------- Teacher: report / cetak ---------- */
function viewTeacherReport() {
  if (!state.evaluations.length)
    return `<h2>Cetak & Kirim Laporan</h2>
      <div class="subtitle">Belum ada evaluasi untuk dicetak.</div>`;
  return `
    <h2>Cetak & Kirim Laporan</h2>
    <div class="subtitle">Pilih evaluasi untuk dicetak atau dikirim ke Kepala Sekolah.</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Siswa</th><th>Kelas</th><th>Periode</th><th>Tanggal</th><th>Aksi</th></tr></thead>
      <tbody>

/* ============================================================
 *  EVENTS
 * ============================================================ */
function bindEvents() {
  // login tabs
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    state.loginTab = b.dataset.tab; render();
  });
  const fl = document.getElementById('form-login');
  if (fl) fl.onsubmit = doLogin;
  const fr = document.getElementById('form-register');
  if (fr) fr.onsubmit = doRegister;
  const ba = document.getElementById('btn-admin');
  if (ba) ba.onclick = () => {
    const pwd = prompt('Masukkan password admin:');
    if (!pwd) return;
    api('adminLogin', { password: pwd }).then(async u => {
      state.user = u;
      localStorage.setItem('evalUser', JSON.stringify(u));
      sessionStorage.setItem('adminPwd', pwd);
      await loadConfig();
      await loadEvaluations();
      await loadTeachers();
      state.view = 'admin-config';
      showMsg('Mode admin aktif', 'success');
    }).catch(err => showMsg(err.message, 'error'));
  };

  const bl = document.getElementById('btn-logout');
  if (bl) bl.onclick = logout;

  // sidebar navigation
  document.querySelectorAll('[data-nav]').forEach(el => el.onclick = async () => {
    state.view = el.dataset.nav;
    if (state.view === 'teacher-new') await loadStudents();
    if (state.view === 'admin-students') { await loadStudents(); await loadConfig(); }
    if (state.view === 'admin-evals')    await loadEvaluations();
    if (state.view === 'admin-teachers') await loadTeachers();
    if (state.view === 'admin-config')   await loadConfig();
    if (state.view === 'teacher-report' || state.view === 'teacher-home') await loadEvaluations();
    render();
  });

  // form evaluation
  const fe = document.getElementById('form-eval');
  if (fe) {
    const updateScores = () => {
      const acad = ['acadPemahaman','acadPartisipasi','acadTugas','acadAnalisis'];
      const kar  = ['karKejujuran','karDisiplin','karSopan','karTanggungJawab','karKerjasama'];
      const avg = (arr) => arr.reduce((s,n)=>s+Number(fe[n].value||0),0) / arr.length;
      document.getElementById('acadScore').textContent = Math.round(avg(acad)*20);
      document.getElementById('karScore').textContent  = Math.round(avg(kar)*20);
    };
    fe.querySelectorAll('[data-aspect]').forEach(s => s.onchange = updateScores);
    updateScores();

    fe.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(fe);
      const data = Object.fromEntries(fd.entries());
      const acad = ['acadPemahaman','acadPartisipasi','acadTugas','acadAnalisis'];
      const kar  = ['karKejujuran','karDisiplin','karSopan','karTanggungJawab','karKerjasama'];
      const avg = (arr) => Math.round(arr.reduce((s,n)=>s+Number(data[n]||0),0) / arr.length * 20);
      const evaluation = {
        teacherUsername: state.user.username,
        teacherName: state.user.fullName,
        studentName: data.studentName,
        studentClass: data.studentClass,
        period: data.period,
        acadPemahaman: data.acadPemahaman,
        acadPartisipasi: data.acadPartisipasi,
        acadTugas: data.acadTugas,
        acadAnalisis: data.acadAnalisis,
        karKejujuran: data.karKejujuran,
        karDisiplin: data.karDisiplin,
        karSopan: data.karSopan,
        karTanggungJawab: data.karTanggungJawab,
        karKerjasama: data.karKerjasama,
        acadScore: avg(acad),
        karScore: avg(kar),
        acadNotes: data.acadNotes,
        karNotes: data.karNotes
      };
      try {
        state.loading = true; render();
        await api('saveEvaluation', { evaluation });
        await loadEvaluations();
        await loadStudents();
        state.loading = false;
        state.view = 'teacher-home';
        showMsg('Evaluasi berhasil disimpan', 'success');
      } catch(err){ state.loading = false; showMsg(err.message, 'error'); }
    };
  }

  // form config
  const fc = document.getElementById('form-config');
  if (fc) fc.onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(fc).entries());
    try {
      state.loading = true; render();
      state.config = await api('saveConfig', { config: data, adminPassword: ADMIN_PWD() });
      state.loading = false;
      await loadConfig();
      showMsg('Konfigurasi disimpan', 'success');
    } catch(err){ state.loading = false; showMsg(err.message, 'error'); }
  };

  // form student
  const fs = document.getElementById('form-student');
  if (fs) fs.onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(fs).entries());
    try {
      await api('addStudent', data);
      await loadStudents();
      showMsg('Siswa ditambahkan', 'success');
    } catch(err){ showMsg(err.message, 'error'); }
  };

  // delete teacher
  document.querySelectorAll('[data-del-teacher]').forEach(b => b.onclick = async () => {
    const u = b.dataset.delTeacher;
    if (!confirm(`Hapus akun "${u}" beserta SEMUA evaluasinya?`)) return;
    try {
      await api('deleteTeacher', { username: u, adminPassword: ADMIN_PWD() });
      await loadTeachers();
      showMsg('Akun guru dihapus', 'success');
    } catch(err){ showMsg(err.message, 'error'); }
  });

  // detail
  document.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => {
    const ev = state.evaluations.find(x => x.id === b.dataset.detail);
    if (ev) showDetail(ev);
  });

  // print one
  document.querySelectorAll('[data-print]').forEach(b => b.onclick = () => {
    const ev = state.evaluations.find(x => x.id === b.dataset.print);
    if (ev) openPrint([ev]);
  });

  // send WA
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => {
    const ev = state.evaluations.find(x => x.id === b.dataset.send);
    if (ev) sendWA(ev);
  });

  // admin CSV
  const bc = document.getElementById('btn-csv-all');
  if (bc) bc.onclick = () => downloadCSV(state.evaluations);

  // admin print all
  const bp = document.getElementById('btn-print-all');
  if (bp) bp.onclick = () => openPrint(state.evaluations);
}

function sendWA(ev) {

    `Catatan: ${ev.acadNotes||'-'}\n\n` +

/* ---------- CSV ---------- */
function downloadCSV(evals) {
  if (!evals.length) return showMsg('Tidak ada data untuk diunduh', 'error');
  const headers = ['Tanggal','Guru','Siswa','Kelas','Periode',
    'Akademik','Karakter','Pemahaman','Partisipasi','Tugas','Analisis',
    'Kejujuran','Disiplin','Sopan','TanggungJawab','Kerjasama',
    'CatatanAkademik','CatatanKarakter'];
  const rows = evals.map(e => [
    fmtDate(e.createdAt), e.teacherName, e.studentName, e.studentClass, e.period,
    e.acadScore, e.karScore,
    e.acadPemahaman, e.acadPartisipasi, e.acadTugas, e.acadAnalisis,
    e.karKejujuran, e.karDisiplin, e.karSopan, e.karTanggungJawab, e.karKerjasama,
    e.acadNotes, e.karNotes
  ]);
  const csv = [headers, ...rows].map(r =>
    r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rangkuman-evaluasi-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Boot ---------- */
(async function boot() {
  await loadConfig();
  if (state.user) {
    // refresh user (kalau ada perubahan)
    try {
      if (state.user.role === 'teacher') {
        // validasi akun guru
        const u = await api('login', { username: state.user.username, password: '' }).catch(()=>null);
      }
      await loadEvaluations();
      if (state.user.role === 'admin') {
        await loadTeachers();
      }
    } catch(e){}
  }
  render();
})();
