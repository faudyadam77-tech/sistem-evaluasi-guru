<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluasi Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hidden { display: none !important; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-gray-100" id="appBody">

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Sistem Evaluasi Guru</h2>
      <div class="flex border-b mb-4">
        <button onclick="switchLoginTab('teacher')" id="tabTeacher" class="flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600">Guru</button>
        <button onclick="switchLoginTab('admin')" id="tabAdmin" class="flex-1 py-2 text-center font-semibold text-gray-500">Admin</button>
      </div>
      
      <!-- Teacher Login/Register -->
      <div id="teacherAuth">
        <div id="loginForm">
          <input type="text" id="loginUser" placeholder="Username" class="w-full p-2 mb-3 border rounded">
          <input type="password" id="loginPass" placeholder="Password" class="w-full p-2 mb-3 border rounded">
          <button onclick="doLoginTeacher()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Masuk</button>
          <p class="text-center mt-3 text-sm text-gray-600">Belum punya akun? <button onclick="toggleRegister(true)" class="text-blue-600 font-semibold">Daftar di sini</button></p>
        </div>
        <div id="registerForm" class="hidden">
          <input type="text" id="regName" placeholder="Nama Lengkap" class="w-full p-2 mb-3 border rounded">
          <input type="text" id="regUser" placeholder="Username" class="w-full p-2 mb-3 border rounded">
          <input type="password" id="regPass" placeholder="Password" class="w-full p-2 mb-3 border rounded">
          <button onclick="doRegister()" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Daftar</button>
          <p class="text-center mt-3 text-sm text-gray-600">Sudah punya akun? <button onclick="toggleRegister(false)" class="text-blue-600 font-semibold">Login di sini</button></p>
        </div>
      </div>

      <!-- Admin Login -->
      <div id="adminAuth" class="hidden">
        <input type="password" id="adminPass" placeholder="Password Admin" class="w-full p-2 mb-3 border rounded">
        <button onclick="doLoginAdmin()" class="w-full bg-red-600 text-white p-2 rounded hover:bg-red-700">Masuk Admin</button>
      </div>
      <div id="msgBox" class="mt-4 text-center text-sm font-semibold"></div>
    </div>
  </div>

  <!-- TEACHER DASHBOARD -->
  <div id="teacherPage" class="hidden min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6 no-print">
        <h1 class="text-2xl font-bold text-gray-800">Dashboard Guru</h1>
        <div>
          <span id="teacherGreeting" class="mr-4 text-gray-600"></span>
          <button onclick="logout()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Logout</button>
        </div>
      </div>

      <!-- Form Evaluasi -->
      <div class="bg-white p-6 rounded-lg shadow mb-6 no-print">
        <h2 class="text-xl font-bold mb-4">Input Evaluasi Siswa</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <input type="text" id="evalStudent" placeholder="Nama Siswa" class="p-2 border rounded">
          <select id="evalClass" class="p-2 border rounded"></select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="font-semibold text-gray-700">Perkembangan Kognitif/Akademik</label>
            <input type="text" id="evalCogScore" placeholder="Skor/Predikat (misal: A, 85)" class="w-full p-2 border rounded mt-1">
            <textarea id="evalCogNote" placeholder="Catatan perkembangan..." class="w-full p-2 border rounded mt-2" rows="2"></textarea>
          </div>
          <div>
            <label class="font-semibold text-gray-700">Perkembangan Karakter/Akhlaq</label>
            <input type="text" id="evalCharScore" placeholder="Skor/Predikat (misal: Baik, 90)" class="w-full p-2 border rounded mt-1">
            <textarea id="evalCharNote" placeholder="Catatan perkembangan..." class="w-full p-2 border rounded mt-2" rows="2"></textarea>
          </div>
        </div>
        <button onclick="saveEval()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Simpan Evaluasi</button>
      </div>

      <!-- Riwayat Evaluasi -->
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold">Riwayat Evaluasi</h2>
          <div class="no-print">
            <button onclick="printReport()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mr-2"><i class="fas fa-print"></i> Cetak</button>
            <button onclick="downloadReport()" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700 mr-2"><i class="fas fa-download"></i> Unduh</button>
            <button onclick="sendToPrincipal()" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700"><i class="fas fa-paper-plane"></i> Kirim ke Kepsek</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-100">
                <th class="p-2 border">Tanggal</th>
                <th class="p-2 border">Siswa</th>
                <th class="p-2 border">Kelas</th>
                <th class="p-2 border">Kognitif</th>
                <th class="p-2 border">Karakter</th>
              </tr>
            </thead>
            <tbody id="teacherEvalTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminPage" class="hidden min-h-screen flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 text-white p-4 no-print">
      <h2 class="text-xl font-bold mb-6">Admin Panel</h2>
      <ul>
        <li class="mb-2"><button onclick="showAdminTab('settings')" class="w-full text-left p-2 hover:bg-gray-700 rounded"><i class="fas fa-cog mr-2"></i> Pengaturan Sekolah</button></li>
        <li class="mb-2"><button onclick="showAdminTab('teachers')" class="w-full text-left p-2 hover:bg-gray-700 rounded"><i class="fas fa-users mr-2"></i> Kelola Guru</button></li>
        <li class="mb-2"><button onclick="showAdminTab('allEvals')" class="w-full text-left p-2 hover:bg-gray-700 rounded"><i class="fas fa-chart-bar mr-2"></i> Semua Evaluasi</button></li>
        <li class="mt-8"><button onclick="logout()" class="w-full text-left p-2 bg-red-600 hover:bg-red-700 rounded"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-auto">
      <!-- Settings Tab -->
      <div id="tabSettings" class="admin-tab bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4">Pengaturan Sekolah</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="font-semibold">Nama Sekolah</label><input type="text" id="setSchoolName" class="w-full p-2 border rounded mt-1"></div>
          <div><label class="font-semibold">Link Logo Sekolah</label><input type="text" id="setLogo" class="w-full p-2 border rounded mt-1"></div>
          <div><label class="font-semibold">Link Background</label><input type="text" id="setBg" class="w-full p-2 border rounded mt-1"></div>
          <div><label class="font-semibold">Nomer WhatsApp Kepala Sekolah</label><input type="text" id="setPhone" class="w-full p-2 border rounded mt-1" placeholder="628xxx"></div>
          <div class="md:col-span-2"><label class="font-semibold">Kelas (Pisahkan dengan koma)</label><input type="text" id="setClasses" class="w-full p-2 border rounded mt-1"></div>
        </div>
        <button onclick="saveSettings()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Simpan Pengaturan</button>
      </div>

      <!-- Teachers Tab -->
      <div id="tabTeachers" class="admin-tab hidden bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4">Kelola Akun Guru</h2>
        <table class="w-full text-left border-collapse">
          <thead><tr class="bg-gray-100"><th class="p-2 border">Nama</th><th class="p-2 border">Username</th><th class="p-2 border">Aksi</th></tr></thead>
          <tbody id="adminTeachersTable"></tbody>
        </table>
      </div>

      <!-- All Evaluations Tab -->
      <div id="tabAllEvals" class="admin-tab hidden bg-white p-6 rounded-lg shadow">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Semua Evaluasi</h2>
          <button onclick="downloadAllReports()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"><i class="fas fa-download"></i> Unduh Rangkuman</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead><tr class="bg-gray-100"><th class="p-2 border">Tanggal</th><th class="p-2 border">Guru</th><th class="p-2 border">Siswa</th><th class="p-2 border">Kelas</th><th class="p-2 border">Kognitif</th><th class="p-2 border">Karakter</th></tr></thead>
            <tbody id="adminEvalsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // FRONTEND LOGIC (GITHUB PAGES MODE)
    // ==========================================
    
    // >>>>>> MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI <<<<<<
    const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJpc7pSjGkrUCdwQUJq_FPXeBK1uBZwk7Tzaw5aGpeWBJqNyJbMKG14W_ibrvLNMU/exec'; 
    // >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>

    let currentUser = null;
    let appSettings = {};

    // Helper untuk komunikasi API dengan Apps Script
    async function callAPI(action, payload = {}) {
      try {
        const response = await fetch(APP_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action, ...payload })
          // CATATAN: JANGAN set header Content-Type agar tidak terkena CORS preflight
        });
        return await response.json();
      } catch (error) {
        console.error(error);
        return { success: false, message: 'Gagal terhubung ke server.' };
      }
    }

    // --- UI HELPERS ---
    function showMsg(msg, isError = false) {
      const box = document.getElementById('msgBox');
      box.innerText = msg;
      box.className = `mt-4 text-center text-sm font-semibold ${isError ? 'text-red-600' : 'text-green-600'}`;
    }

    function switchLoginTab(type) {
      document.getElementById('teacherAuth').classList.toggle('hidden', type !== 'teacher');
      document.getElementById('adminAuth').classList.toggle('hidden', type !== 'admin');
      document.getElementById('tabTeacher').className = type === 'teacher' ? 'flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600' : 'flex-1 py-2 text-center font-semibold text-gray-500';
      document.getElementById('tabAdmin').className = type === 'admin' ? 'flex-1 py-2 text-center font-semibold text-red-600 border-b-2 border-red-600' : 'flex-1 py-2 text-center font-semibold text-gray-500';
    }

    function toggleRegister(show) {
      document.getElementById('loginForm').classList.toggle('hidden', show);
      document.getElementById('registerForm').classList.toggle('hidden', !show);
    }

    function showAdminTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('teacherPage').classList.add('hidden');
      document.getElementById('adminPage').classList.add('hidden');
    }

    // --- AUTH FUNCTIONS ---
    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      
      if(!name || !user || !pass) return showMsg('Semua field harus diisi!', true);
      
      const res = await callAPI('register', { username: user, password: pass, name: name });
      showMsg(res.message, !res.success);
      if(res.success) {
        toggleRegister(false);
        showMsg('Registrasi berhasil! Silakan login.', false);
      }
    }

    async function doLoginTeacher() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      
      if(!user || !pass) return showMsg('Username dan password harus diisi!', true);

      const res = await callAPI('loginTeacher', { username: user, password: pass });
      if(res.success) {
        currentUser = res;
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('teacherPage').classList.remove('hidden');
        document.getElementById('teacherGreeting').innerText = `Halo, ${res.name}`;
        loadTeacherData();
      } else {
        showMsg(res.message, true);
      }
    }

    async function doLoginAdmin() {
      const pass = document.getElementById('adminPass').value.trim();
      const res = await callAPI('loginAdmin', { password: pass });
      if(res.success) {
        currentUser = { role: 'admin' };
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('adminPage').classList.remove('hidden');
        loadAdminData();
      } else {
        showMsg(res.message, true);
      }
    }

    // --- TEACHER FUNCTIONS ---
    async function loadTeacherData() {
      const settings = await callAPI('getSettings');
      appSettings = settings;
      const sel = document.getElementById('evalClass');
      sel.innerHTML = '';
      if(settings.classes) {
        settings.classes.split(',').forEach(c => {
          sel.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`;
        });
      }

      const evals = await callAPI('getTeacherEvaluations', { username: currentUser.username });
      const tbody = document.getElementById('teacherEvalTable');
      tbody.innerHTML = '';
      if(Array.isArray(evals)) {
        evals.forEach(e => {
          tbody.innerHTML += `<tr>
            <td class="p-2 border">${e.date}</td>
            <td class="p-2 border">${e.student}</td>
            <td class="p-2 border">${e.class}</td>
            <td class="p-2 border">${e.cogScore} - ${e.cogNote}</td>
            <td class="p-2 border">${e.charScore} - ${e.charNote}</td>
          </tr>`;
        });
      }
    }

    async function saveEval() {
      const data = {
        username: currentUser.username,
        teacherName: currentUser.name,
        studentName: document.getElementById('evalStudent').value.trim(),
        class: document.getElementById('evalClass').value,
        cogScore: document.getElementById('evalCogScore').value.trim(),
        cogNote: document.getElementById('evalCogNote').value.trim(),
        charScore: document.getElementById('evalCharScore').value.trim(),
        charNote: document.getElementById('evalCharNote').value.trim()
      };
      if(!data.studentName) return alert('Nama siswa harus diisi!');

      await callAPI('saveEvaluation', { evalData: data });
      alert('Evaluasi berhasil disimpan!');
      loadTeacherData();
      
      document.getElementById('evalStudent').value = '';
      document.getElementById('evalCogScore').value = '';
      document.getElementById('evalCogNote').value = '';
      document.getElementById('evalCharScore').value = '';
      document.getElementById('evalCharNote').value = '';
    }

    function printReport() { window.print(); }

    async function downloadReport() {
      const evals = await callAPI('getTeacherEvaluations', { username: currentUser.username });
      let csv = 'Tanggal,Siswa,Kelas,Kognitif,Karakter\n';
      if(Array.isArray(evals)) {
        evals.forEach(e => {
          csv += `"${e.date}","${e.student}","${e.class}","${e.cogScore} - ${e.cogNote}","${e.charScore} - ${e.charNote}"\n`;
        });
      }
      downloadCSV(csv, `Evaluasi_${currentUser.name}.csv`);
    }

    async function sendToPrincipal() {
      const evals = await callAPI('getTeacherEvaluations', { username: currentUser.username });
      let text = `Laporan Evaluasi Guru: ${currentUser.name}\nSekolah: ${appSettings.schoolName}\n\n`;
      if(Array.isArray(evals)) {
        evals.forEach(e => {
          text += `Siswa: ${e.student} (${e.class})\nKognitif: ${e.cogScore} - ${e.cogNote}\nKarakter: ${e.charScore} - ${e.charNote}\n---\n`;
        });
      }
      const url = `https://wa.me/${appSettings.principalPhone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // --- ADMIN FUNCTIONS ---
    async function loadAdminData() {
      const settings = await callAPI('getSettings');
      appSettings = settings;
      document.getElementById('setSchoolName').value = settings.schoolName || '';
      document.getElementById('setLogo').value = settings.logoUrl || '';
      document.getElementById('setBg').value = settings.bgUrl || '';
      document.getElementById('setPhone').value = settings.principalPhone || '';
      document.getElementById('setClasses').value = settings.classes || '';
      
      if(settings.bgUrl) document.getElementById('appBody').style.backgroundImage = `url(${settings.bgUrl})`;

      loadAdminTeachers();
      loadAdminEvals();
    }

    async function saveSettings() {
      const settings = {
        schoolName: document.getElementById('setSchoolName').value.trim(),
        logoUrl: document.getElementById('setLogo').value.trim(),
        bgUrl: document.getElementById('setBg').value.trim(),
        principalPhone: document.getElementById('setPhone').value.trim(),
        classes: document.getElementById('setClasses').value.trim()
      };
      await callAPI('saveSettings', { settings: settings });
      alert('Pengaturan berhasil disimpan!');
      loadAdminData();
    }

    async function loadAdminTeachers() {
      const teachers = await callAPI('getTeachers');
      const tbody = document.getElementById('adminTeachersTable');
      tbody.innerHTML = '';
      if(Array.isArray(teachers)) {
        teachers.forEach(t => {
          tbody.innerHTML += `<tr>
            <td class="p-2 border">${t.name}</td>
            <td class="p-2 border">${t.username}</td>
            <td class="p-2 border"><button onclick="deleteTeacher('${t.username}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Hapus</button></td>
          </tr>`;
        });
      }
    }

    async function deleteTeacher(username) {
      if(confirm('Hapus guru ini beserta semua datanya?')) {
        await callAPI('deleteTeacher', { username: username });
        loadAdminTeachers();
        loadAdminEvals();
      }
    }

    async function loadAdminEvals() {
      const evals = await callAPI('getAllEvaluations');
      const tbody = document.getElementById('adminEvalsTable');
      tbody.innerHTML = '';
      if(Array.isArray(evals)) {
        evals.forEach(e => {
          tbody.innerHTML += `<tr>
            <td class="p-2 border">${e.date}</td>
            <td class="p-2 border">${e.teacher}</td>
            <td class="p-2 border">${e.student}</td>
            <td class="p-2 border">${e.class}</td>
            <td class="p-2 border">${e.cogScore}</td>
            <td class="p-2 border">${e.charScore}</td>
          </tr>`;
        });
      }
    }

    async function downloadAllReports() {
      const evals = await callAPI('getAllEvaluations');
      let csv = 'Tanggal,Guru,Siswa,Kelas,Kognitif (Skor),Kognitif (Catatan),Karakter (Skor),Karakter (Catatan)\n';
      if(Array.isArray(evals)) {
        evals.forEach(e => {
          csv += `"${e.date}","${e.teacher}","${e.student}","${e.class}","${e.cogScore}","${e.cogNote}","${e.charScore}","${e.charNote}"\n`;
        });
      }
      downloadCSV(csv, 'Rangkuman_Semua_Evaluasi.csv');
    }

    // --- UTILITY ---
    function downloadCSV(csv, filename) {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>
