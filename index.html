<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluasi Siswa</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f1f5f9;--card:#fff;
    --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
    --success:#16a34a;--danger:#dc2626;--warn:#f59e0b;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;background-size:cover;
    background-attachment:fixed;background-position:center}
  body.has-bg::before{content:'';position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:-1}
  #root{min-height:100vh}
  .hidden{display:none!important}

  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand img{height:36px;width:36px;object-fit:contain;border-radius:6px}
  .user-info{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
  .badge{background:#dbeafe;color:var(--primary-dark);padding:3px 8px;border-radius:20px;
    font-size:12px;font-weight:600}
  .badge.admin{background:#fee2e2;color:#991b1b}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:linear-gradient(135deg,#1e3a8a,#2563eb)}
  .login-card{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:400px;
    box-shadow:0 20px 40px rgba(0,0,0,.2)}
  .login-card h1{font-size:22px;margin-bottom:6px}
  .login-card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:#f1f5f9;padding:4px;border-radius:10px}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;cursor:pointer;
    border-radius:7px;font-weight:600;color:var(--muted);font-size:14px}
  .tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
  textarea{resize:vertical;min-height:80px}
  .field{margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-ghost{background:#f1f5f9;color:var(--text)}
  .btn-ghost:hover{background:#e2e8f0}
  .btn-block{width:100%;justify-content:center}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.6;cursor:not-allowed}

  .layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 61px)}
  .sidebar{background:#fff;border-right:1px solid var(--border);padding:16px 0}
  .sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;
    cursor:pointer;font-size:14px;color:#334155;border-left:3px solid transparent}
  .sidebar .nav-item:hover{background:#f8fafc}
  .sidebar .nav-item.active{background:#eff6ff;color:var(--primary);
    border-left-color:var(--primary);font-weight:600}
  .sidebar .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);padding:14px 20px 6px;font-weight:700}
  .content{padding:24px;overflow-x:auto}
  .content h2{font-size:20px;margin-bottom:4px}
  .content .subtitle{color:var(--muted);font-size:13px;margin-bottom:20px}

  .card{background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:16px}
  .card h3{font-size:15px;margin-bottom:14px;color:#334155}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  @media(max-width:780px){
    .layout{grid-template-columns:1fr}
    .sidebar{display:flex;overflow-x:auto;padding:8px;border-right:none;
      border-bottom:1px solid var(--border)}
    .sidebar .nav-item{padding:8px 12px;border-left:none;border-bottom:2px solid transparent;
      white-space:nowrap}
    .sidebar .nav-item.active{border-left:none;border-bottom-color:var(--primary)}
    .sidebar .nav-title{display:none}
    .grid-2,.row{grid-template-columns:1fr}
  }

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;font-weight:600;color:#334155;font-size:12px;
    text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:#f8fafc}
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px}

  .aspect-row{display:grid;grid-template-columns:1fr 130px;align-items:center;
    gap:10px;padding:8px 0;border-bottom:1px dashed #e2e8f0}
  .aspect-row:last-child{border-bottom:none}
  .aspect-row span{font-size:14px}
  .score-badge{display:inline-block;background:#eff6ff;color:var(--primary-dark);
    padding:6px 12px;border-radius:8px;font-weight:700;font-size:18px}

  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:12px;padding:24px;max-width:620px;width:100%;
    max-height:88vh;overflow-y:auto}
  .modal h3{margin-bottom:10px}
  .modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

  .loader{display:inline-block;width:14px;height:14px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner-box{display:flex;align-items:center;gap:10px;color:var(--muted);
    font-size:14px;padding:12px}

  @media print{
    body{background:#fff!important}
    body.has-bg::before{display:none}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';

/* ============================================================
 *  KONFIGURASI URL APPS SCRIPT
 *  ------------------------------------------------------------------
 *  Baris ini dipertahankan sesuai permintaan. Isi dengan URL Web App
 *  Anda (Deploy > New deployment > Web app > Copy URL).
 *
 *  Catatan: aplikasi ini KOMUNIKASI UTAMANYA lewat
 *  google.script.run (jauh lebih cepat karena berjalan di container
 *  yang sama), sehingga API_URL ini hanya sebagai referensi/cadangan.
 * ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxJpc7pSjGkrUCdwQUJq_FPXeBK1uBZwk7Tzaw5aGpeWBJqNyJbMKG14W_ibrvLNMU/exec';
/* ============================================================ */

/* ============================================================
 *  STATE
 * ============================================================ */
const state = {
  user: null,
  config: {},
  view: 'login',
  loginTab: 'login',
  students: [],
  evaluations: [],
  teachers: [],
  loading: false,
  msg: null,
  _evalStale: true,
  _teacherStale: true
};

try {
  const saved = localStorage.getItem('evalUser');
  if (saved) {
    state.user = JSON.parse(saved);
    state.view = state.user.role === 'admin' ? 'admin-config' : 'teacher-home';
  }
} catch (e) {}

/* ============================================================
 *  API — pakai google.script.run (CEPAT)
 * ============================================================ */
function api(action, payload) {
  payload = payload || {};
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) resolve(r.data);
        else reject(new Error((r && r.error) || 'Terjadi kesalahan server'));
      })
      .withFailureHandler(function (err) {
        reject(new Error((err && err.message) || 'Gagal terhubung ke server'));
      })
      .apiCall(Object.assign({ action: action }, payload));
  });
}

/**
 * Cadangan: panggilan lewat fetch ke API_URL (misal untuk testing).
 * Tidak dipakai di alur utama.
 */
async function apiFallback(action, payload) {
  payload = payload || {};
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload))
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Terjadi kesalahan server');
  return json.data;
}

/* ============================================================
 *  HELPERS
 * ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]);
  });
}
function fmtDate(d) {
  if (!d) return '-';
  var x = new Date(d);
  if (isNaN(x)) return '-';
  return x.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}
function showMsg(text, type) {
  state.msg = { text: text, type: type || 'info' };
  render();
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(function () { state.msg = null; render(); }, 3500);
}
function ADMIN_PWD() {
  return localStorage.getItem('adminPwd') || '';
}

/* ============================================================
 *  DATA LOADERS
 * ============================================================ */
async function loadConfig(force) {
  if (!force && state.config && state.config.schoolName) {
    applyBg();
    return;
  }
  try {
    state.config = await api('getConfig');
    applyBg();
  } catch (e) { console.error(e); }
}
function applyBg() {
  if (state.config.bgUrl) {
    document.body.style.backgroundImage = "url('" + state.config.bgUrl + "')";
    document.body.classList.add('has-bg');
  } else {
    document.body.style.backgroundImage = '';
    document.body.classList.remove('has-bg');
  }
}

async function loadStudents(force) {
  if (!force && state.students.length) return;
  try { state.students = await api('getStudents'); } catch (e) {}
}

async function loadEvaluations(force) {
  if (!force && state.evaluations.length && !state._evalStale) return;
  try {
    var payload = (state.user.role === 'admin')
      ? { adminPassword: ADMIN_PWD() }
      : { teacherUsername: state.user.username };
    state.evaluations = await api('getEvaluations', payload);
    state._evalStale = false;
  } catch (e) { showMsg(e.message, 'error'); }
}

async function loadTeachers(force) {
  if (!force && state.teachers.length && !state._teacherStale) return;
  try {
    state.teachers = await api('getTeachers', { adminPassword: ADMIN_PWD() });
    state._teacherStale = false;
  } catch (e) {
    state.teachers = [];
    showMsg(e.message, 'error');
  }
}

/* ============================================================
 *  AUTH
 * ============================================================ */
async function doLogin(e) {
  e.preventDefault();
  var f = e.target;
  try {
    state.loading = true; render();
    var u = await api('login', { username: f.username.value, password: f.password.value });
    state.user = u;
    localStorage.setItem('evalUser', JSON.stringify(u));
    state.view = 'teacher-home';
    state._evalStale = true;
    await loadConfig(true);
    await loadEvaluations(true);
    showMsg('Selamat datang, ' + u.fullName, 'success');
  } catch (err) {
    showMsg(err.message, 'error');
  } finally {
    state.loading = false; render();
  }
}

async function doRegister(e) {
  e.preventDefault();
  var f = e.target;
  try {
    state.loading = true; render();
    await api('register', {
      username: f.username.value,
      password: f.password.value,
      fullName: f.fullName.value
    });
    showMsg('Akun berhasil dibuat. Silakan login.', 'success');
    state.loginTab = 'login';
  } catch (err) {
    showMsg(err.message, 'error');
  } finally {
    state.loading = false; render();
  }
}

async function askAdmin() {
  var pwd = prompt('Masukkan password admin:');
  if (!pwd) return;
  try {
    state.loading = true; render();
    var u = await api('adminLogin', { password: pwd });
    state.user = u;
    localStorage.setItem('evalUser', JSON.stringify(u));
    localStorage.setItem('adminPwd', pwd);
    state._evalStale = true;
    state._teacherStale = true;
    await loadConfig(true);
    await loadEvaluations(true);
    await loadTeachers(true);
    state.view = 'admin-config';
    showMsg('Mode admin aktif', 'success');
  } catch (err) {
    showMsg(err.message, 'error');
  } finally {
    state.loading = false; render();
  }
}

function logout() {
  state.user = null;
  state.evaluations = [];
  state.students = [];
  state.teachers = [];
  state._evalStale = true;
  state._teacherStale = true;
  localStorage.removeItem('evalUser');
  localStorage.removeItem('adminPwd');
  state.view = 'login';
  state.loginTab = 'login';
  render();
}

/* ============================================================
 *  RENDER
 * ============================================================ */
function render() {
  var root = document.getElementById('root');
  if (!state.user) root.innerHTML = renderLogin();
  else root.innerHTML = renderApp();
  bindEvents();
}

function renderLogin() {
  var cfg = state.config || {};
  var bgStyle = cfg.bgUrl
    ? "background:linear-gradient(135deg,rgba(30,58,138,.85),rgba(37,99,235,.85)),url('" + esc(cfg.bgUrl) + "') center/cover"
    : '';
  return '' +
  '<div class="login-wrap" style="' + bgStyle + '">' +
    '<div class="login-card">' +
      '<div style="text-align:center;margin-bottom:18px">' +
        (cfg.logoUrl ? '<img src="' + esc(cfg.logoUrl) + '" style="height:56px;margin-bottom:8px">' : '') +
        '<h1>' + esc(cfg.schoolName || 'Evaluasi Siswa') + '</h1>' +
        '<div class="sub">Aplikasi Evaluasi Perkembangan Siswa</div>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="' + (state.loginTab === 'login' ? 'active' : '') + '" data-tab="login">Masuk</button>' +
        '<button class="' + (state.loginTab === 'register' ? 'active' : '') + '" data-tab="register">Daftar</button>' +
      '</div>' +
      (state.msg ? '<div class="alert alert-' + state.msg.type + '">' + esc(state.msg.text) + '</div>' : '') +
      (state.loginTab === 'login'
        ? '<form id="form-login">' +
            '<div class="field"><label>Username</label>' +
              '<input name="username" required autocomplete="username"></div>' +
            '<div class="field"><label>Password</label>' +
              '<input name="password" type="password" required autocomplete="current-password"></div>' +
            '<button class="btn btn-primary btn-block" ' + (state.loading ? 'disabled' : '') + '>' +
              (state.loading ? '<span class="loader"></span> Memproses...' : 'Masuk') +
            '</button>' +
          '</form>'
        : '<form id="form-register">' +
            '<div class="field"><label>Nama Lengkap</label>' +
              '<input name="fullName" required></div>' +
            '<div class="field"><label>Username</label>' +
              '<input name="username" required autocomplete="username"></div>' +
            '<div class="field"><label>Password (min 4 karakter)</label>' +
              '<input name="password" type="password" required minlength="4"></div>' +
            '<button class="btn btn-primary btn-block" ' + (state.loading ? 'disabled' : '') + '>' +
              (state.loading ? '<span class="loader"></span> Memproses...' : 'Daftar Akun Guru') +
            '</button>' +
          '</form>') +
      '<div style="text-align:center;margin-top:16px">' +
        '<button class="btn btn-ghost btn-sm" id="btn-admin">🔐 Masuk Mode Admin</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderApp() {
  var u = state.user;
  var isAdmin = u.role === 'admin';
  var cfg = state.config || {};

  var navTeacher = [
    { id: 'teacher-home',   label: '📋 Evaluasi Saya' },
    { id: 'teacher-new',    label: '➕ Buat Evaluasi' },
    { id: 'teacher-report', label: '🖨️ Cetak & Kirim' }
  ];
  var navAdmin = [
    { id: 'admin-config',   label: '⚙️ Konfigurasi' },
    { id: 'admin-students', label: '👥 Data Siswa' },
    { id: 'admin-teachers', label: '👨‍🏫 Akun Guru' },
    { id: 'admin-evals',    label: '📊 Semua Evaluasi' },
    { id: 'admin-report',   label: '🖨️ Rangkuman & Cetak' }
  ];
  var nav = isAdmin ? navAdmin : navTeacher;

  return '' +
  '<div class="topbar">' +
    '<div class="brand">' +
      (cfg.logoUrl ? '<img src="' + esc(cfg.logoUrl) + '">' : '') +
      '<span>' + esc(cfg.schoolName || 'Evaluasi Siswa') + '</span>' +
    '</div>' +
    '<div class="user-info">' +
      '<span>' + esc(u.fullName) + '</span>' +
      '<span class="badge ' + (isAdmin ? 'admin' : '') + '">' + (isAdmin ? 'ADMIN' : 'GURU') + '</span>' +
      '<button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button>' +
    '</div>' +
  '</div>' +
  '<div class="layout">' +
    '<aside class="sidebar">' +
      '<div class="nav-title">Menu</div>' +
      nav.map(function (n) {
        return '<div class="nav-item ' + (state.view === n.id ? 'active' : '') + '" data-nav="' + n.id + '">' + n.label + '</div>';
      }).join('') +
    '</aside>' +
    '<main class="content">' +
      (state.msg ? '<div class="alert alert-' + state.msg.type + '">' + esc(state.msg.text) + '</div>' : '') +
      renderView() +
    '</main>' +
  '</div>';
}

function renderView() {
  switch (state.view) {
    case 'teacher-home':   return viewTeacherHome();
    case 'teacher-new':    return viewTeacherNew();
    case 'teacher-report': return viewTeacherReport();
    case 'admin-config':   return viewAdminConfig();
    case 'admin-students': return viewAdminStudents();
    case 'admin-teachers': return viewAdminTeachers();
    case 'admin-evals':    return viewAdminEvals();
    case 'admin-report':   return viewAdminReport();
    default: return '<div class="card">Halaman tidak ditemukan</div>';
  }
}

/* ---------- Teacher views ---------- */
function viewTeacherHome() {
  if (state.loading) return '<div class="spinner-box"><span class="loader" style="border-color:#2563eb;border-top-color:transparent"></span> Memuat data...</div>';
  var list = state.evaluations;
  if (!list.length) return '' +
    '<h2>Evaluasi Saya</h2>' +
    '<div class="subtitle">Daftar evaluasi yang pernah Anda buat.</div>' +
    '<div class="card" style="text-align:center;padding:40px">' +
      '<p style="color:var(--muted);margin-bottom:16px">Belum ada evaluasi.</p>' +
      '<button class="btn btn-primary" data-nav="teacher-new">➕ Buat Evaluasi Pertama</button>' +
    '</div>';

  return '' +
    '<h2>Evaluasi Saya</h2>' +
    '<div class="subtitle">Total ' + list.length + ' evaluasi.</div>' +
    '<div class="table-wrap"><table>' +
      '<thead><tr>' +
        '<th>Siswa</th><th>Kelas</th><th>Periode</th>' +
        '<th>Akademik</th><th>Karakter</th><th>Tanggal</th><th>Aksi</th>' +
      '</tr></thead><tbody>' +
      list.map(function (e) {
        return '<tr>' +
          '<td><strong>' + esc(e.studentName) + '</strong></td>' +
          '<td>' + esc(e.studentClass) + '</td>' +
          '<td>' + esc(e.period) + '</td>' +
          '<td><span class="score-badge" style="font-size:14px;padding:3px 8px">' + esc(e.acadScore) + '</span></td>' +
          '<td><span class="score-badge" style="font-size:14px;padding:3px 8px">' + esc(e.karScore) + '</span></td>' +
          '<td>' + fmtDate(e.createdAt) + '</td>' +
          '<td><button class="btn btn-ghost btn-sm" data-detail="' + esc(e.id) + '">Detail</button></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
}

function viewTeacherNew() {
  var classes = (state.config.classes || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var periods = currentPeriods();
  return '' +
  '<h2>Buat Evaluasi Baru</h2>' +
  '<div class="subtitle">Isi penilaian perkembangan kognitif/akademik dan karakter/akhlaq siswa.</div>' +
  '<form id="form-eval">' +
    '<div class="card">' +
      '<h3>Identitas Siswa</h3>' +
      '<div class="row">' +
        '<div class="field"><label>Kelas</label>' +
          '<select name="studentClass" required>' +
            '<option value="">— Pilih Kelas —</option>' +
            classes.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="field"><label>Nama Siswa</label>' +
          '<input name="studentName" list="student-list" required placeholder="Ketik atau pilih nama siswa">' +
          '<datalist id="student-list">' +
            state.students.map(function (s) {
              return '<option data-kelas="' + esc(s.className) + '" value="' + esc(s.name) + '">' + esc(s.className) + '</option>';
            }).join('') +
          '</datalist></div>' +
      '</div>' +
      '<div class="field"><label>Periode Penilaian</label>' +
        '<select name="period" required>' +
          periods.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') +
        '</select></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card">' +
        '<h3>🧠 Perkembangan Kognitif / Akademik</h3>' +

function currentPeriods() {

  return [

}

/* ============================================================
 *  EVENTS
 * ============================================================ */
function bindEvents() {
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.onclick = function () { state.loginTab = b.dataset.tab; render(); };
  });

  var fl = document.getElementById('form-login');
  if (fl) fl.onsubmit = doLogin;
  var fr = document.getElementById('form-register');
  if (fr) fr.onsubmit = doRegister;
  var ba = document.getElementById('btn-admin');
  if (ba) ba.onclick = askAdmin;
  var bl = document.getElementById('btn-logout');
  if (bl) bl.onclick = logout;

  document.querySelectorAll('[data-nav]').forEach(function (el) {
    el.onclick = async function () {
      state.view = el.dataset.nav;
      if (state.view === 'teacher-new')    await loadStudents();
      if (state.view === 'admin-students') await loadStudents();
      if (state.view === 'admin-evals')    await loadEvaluations();
      if (state.view === 'admin-teachers') await loadTeachers();
      if (state.view === 'admin-config')   await loadConfig();
      if (state.view === 'teacher-report' || state.view === 'teacher-home') await loadEvaluations();
      render();
    };
  });

  var fe = document.getElementById('form-eval');
  if (fe) {
    var updateScores = function () {
      var acad = ['acadPemahaman', 'acadPartisipasi', 'acadTugas', 'acadAnalisis'];
      var kar  = ['karKejujuran', 'karDisiplin', 'karSopan', 'karTanggungJawab', 'karKerjasama'];
      var avg = function (arr) {
        var s = 0;
        for (var i = 0; i < arr.length; i++) s += Number(fe[arr[i]].value || 0);
        return Math.round(s / arr.length * 20);
      };
      document.getElementById('acadScore').textContent = avg(acad);
      document.getElementById('karScore').textContent = avg(kar);
    };
    fe.querySelectorAll('[data-aspect]').forEach(function (s) { s.onchange = updateScores; });
    updateScores();

    fe.onsubmit = async function (e) {
      e.preventDefault();
      var data = {};
      new FormData(fe).forEach(function (v, k) { data[k] = v; });
      var acad = ['acadPemahaman', 'acadPartisipasi', 'acadTugas', 'acadAnalisis'];
      var kar  = ['karKejujuran', 'karDisiplin', 'karSopan', 'karTanggungJawab', 'karKerjasama'];
      var avg = function (arr) {
        var s = 0;
        for (var i = 0; i < arr.length; i++) s += Number(data[arr[i]] || 0);
        return Math.round(s / arr.length * 20);
      };
      var evaluation = {
        teacherUsername: state.user.username,
        teacherName: state.user.fullName,
        studentName: data.studentName,
        studentClass: data.studentClass,
        period: data.period,
        acadPemahaman: data.acadPemahaman,
        acadPartisipasi: data.acadPartisipasi,
        acadTugas: data.acadTugas,
        acadAnalisis: data.acadAnalisis,
        karKejujuran: data.karKejujuran,
        karDisiplin: data.karDisiplin,
        karSopan: data.karSopan,
        karTanggungJawab: data.karTanggungJawab,
        karKerjasama: data.karKerjasama,
        acadScore: avg(acad),
        karScore: avg(kar),
        acadNotes: data.acadNotes,
        karNotes: data.karNotes
      };
      try {
        state.loading = true; render();
        await api('saveEvaluation', { evaluation: evaluation });
        state._evalStale = true;
        await loadEvaluations(true);
        await loadStudents(true);
        state.loading = false;
        state.view = 'teacher-home';
        showMsg('Evaluasi berhasil disimpan', 'success');
      } catch (err) {
        state.loading = false;
        showMsg(err.message, 'error');
      }
    };
  }

  var fc = document.getElementById('form-config');
  if (fc) fc.onsubmit = async function (e) {
    e.preventDefault();
    var data = {};
    new FormData(fc).forEach(function (v, k) { data[k] = v; });
    try {
      state.loading = true; render();
      state.config = await api('saveConfig', { config: data, adminPassword: ADMIN_PWD() });
      state.loading = false;
      await loadConfig(true);
      showMsg('Konfigurasi disimpan', 'success');
    } catch (err) {
      state.loading = false;
      showMsg(err.message, 'error');
    }
  };

  var fs = document.getElementById('form-student');
  if (fs) fs.onsubmit = async function (e) {
    e.preventDefault();
    var data = {};
    new FormData(fs).forEach(function (v, k) { data[k] = v; });
    try {
      await api('addStudent', data);
      await loadStudents(true);
      showMsg('Siswa ditambahkan', 'success');
    } catch (err) {
      showMsg(err.message, 'error');
    }
  };

  document.querySelectorAll('[data-del-teacher]').forEach(function (b) {
    b.onclick = async function () {
      var u = b.dataset.delTeacher;
      if (!confirm('Hapus akun "' + u + '" beserta SEMUA evaluasinya?')) return;
      try {
        state.loading = true; render();
        await api('deleteTeacher', { username: u, adminPassword: ADMIN_PWD() });
        state._teacherStale = true;
        state._evalStale = true;
        await loadTeachers(true);
        state.loading = false;
        showMsg('Akun guru dihapus', 'success');
      } catch (err) {
        state.loading = false;
        showMsg(err.message, 'error');
      }
    };
  });

  document.querySelectorAll('[data-detail]').forEach(function (b) {
    b.onclick = function () {
      var ev = state.evaluations.find(function (x) { return x.id === b.dataset.detail; });
      if (ev) showDetail(ev);
    };
  });

  document.querySelectorAll('[data-print]').forEach(function (b) {
    b.onclick = function () {
      var ev = state.evaluations.find(function (x) { return x.id === b.dataset.print; });
      if (ev) openPrint([ev]);
    };
  });

  document.querySelectorAll('[data-send]').forEach(function (b) {
    b.onclick = function () {
      var ev = state.evaluations.find(function (x) { return x.id === b.dataset.send; });
      if (ev) sendWA(ev);
    };
  });

  var bc = document.getElementById('btn-csv-all');
  if (bc) bc.onclick = function () { downloadCSV(state.evaluations); };
  var bp = document.getElementById('btn-print-all');
  if (bp) bp.onclick = function () { openPrint(state.evaluations); };
}

          '</div>' +
          '<p style="margin-top:8px;font-size:13px;color:var(--muted)"><b>Catatan:</b> ' + esc(ev.karNotes || '-') + '</p>' +
        '</div>' +
      '</div>' +
      '<p style="margin-top:10px;font-size:12px;color:var(--muted)">Dinilai oleh: ' + esc(ev.teacherName) + ' • ' + fmtDate(ev.createdAt) + '</p>' +
      '<div class="actions">' +
        '<button class="btn btn-ghost" id="modal-close">Tutup</button>' +

        '<button class="btn btn-success" id="modal-send">💬 Kirim</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  var wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  document.getElementById('modal-close').onclick = function () { document.getElementById('modal-bg').remove(); };
  document.getElementById('modal-bg').onclick = function (e) { if (e.target.id === 'modal-bg') e.currentTarget.remove(); };
  document.getElementById('modal-print').onclick = function () { openPrint([ev]); };
  document.getElementById('modal-send').onclick = function () { sendWA(ev); };
}

  var cfg = state.config || {};
  if (!evals.length) { showMsg('Tidak ada data untuk dicetak', 'error'); return; }
  var body = evals.map(function (ev) {
    return '<div style="page-break-after:always;margin-bottom:30px;border:1px solid #cbd5e1;padding:24px;border-radius:8px">' +
      '<div style="display:flex;align-items:center;gap:14px;border-bottom:2px solid #1e40af;padding-bottom:10px;margin-bottom:16px">' +
        (cfg.logoUrl ? '<img src="' + esc(cfg.logoUrl) + '" style="height:56px">' : '') +
        '<div>' +
          '<h1 style="font-size:18px;margin:0">' + esc(cfg.schoolName || 'Sekolah') + '</h1>' +
          '<div style="font-size:13px;color:#64748b">Laporan Evaluasi Perkembangan Siswa</div>' +
        '</div>' +
      '</div>' +
      '<table style="width:100%;font-size:13px;margin-bottom:14px">' +
        '<tr><td style="width:150px"><b>Nama Siswa</b></td><td>: ' + esc(ev.studentName) + '</td></tr>' +
        '<tr><td><b>Kelas</b></td><td>: ' + esc(ev.studentClass) + '</td></tr>' +
        '<tr><td><b>Periode</b></td><td>: ' + esc(ev.period) + '</td></tr>' +
        '<tr><td><b>Guru Penilai</b></td><td>: ' + esc(ev.teacherName) + '</td></tr>' +
        '<tr><td><b>Tanggal</b></td><td>: ' + fmtDate(ev.createdAt) + '</td></tr>' +

/* ---------- WhatsApp ---------- */
function sendWA(ev) {
  var cfg = state.config || {};
  var phone = String(cfg.principalPhone || '').replace(/\D/g, '');
  if (!phone) return showMsg('Nomor WA Kepala Sekolah belum diatur di konfigurasi', 'error');
  var text = '*LAPORAN EVALUASI SISWA*\n' +
    'Sekolah: ' + (cfg.schoolName || '-') + '\n' +
    'Periode: ' + ev.period + '\n\n' +
    '*Nama Siswa:* ' + ev.studentName + '\n' +
    '*Kelas:* ' + ev.studentClass + '\n\n' +
    '*Nilai Akademik:* ' + ev.acadScore + '/100\n' +
    'Catatan: ' + (ev.acadNotes || '-') + '\n\n' +
    '*Nilai Karakter:* ' + ev.karScore + '/100\n' +
    'Catatan: ' + (ev.karNotes || '-') + '\n\n' +
    'Guru Penilai: ' + ev.teacherName + '\n' +
    'Tanggal: ' + fmtDate(ev.createdAt);
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(text), '_blank');
}

/* ---------- CSV ---------- */
function downloadCSV(evals) {
  if (!evals.length) return showMsg('Tidak ada data untuk diunduh', 'error');
  var headers = ['Tanggal', 'Guru', 'Siswa', 'Kelas', 'Periode',
    'Akademik', 'Karakter', 'Pemahaman', 'Partisipasi', 'Tugas', 'Analisis',
    'Kejujuran', 'Disiplin', 'Sopan', 'TanggungJawab', 'Kerjasama',
    'CatatanAkademik', 'CatatanKarakter'];
  var rows = evals.map(function (e) {
    return [fmtDate(e.createdAt), e.teacherName, e.studentName, e.studentClass, e.period,
      e.acadScore, e.karScore,
      e.acadPemahaman, e.acadPartisipasi, e.acadTugas, e.acadAnalisis,
      e.karKejujuran, e.karDisiplin, e.karSopan, e.karTanggungJawab, e.karKerjasama,
      e.acadNotes, e.karNotes];
  });
  var csv = [headers].concat(rows).map(function (r) {
    return r.map(function (c) {
      return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'rangkuman-evaluasi-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

(async function boot() {
  await loadConfig();
  if (state.user) {
    try {
      await loadEvaluations(true);
      if (state.user.role === 'admin') await loadTeachers(true);
    } catch (e) { console.error(e); }
  }
  render();
})();
